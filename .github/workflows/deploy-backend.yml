name: Deploy Clinic API to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Periksa kredensial deployment
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$ADMIN_API_TOKEN" ] && [ -n "$D1_DATABASE_ID" ]; then
            echo "DEPLOY_ENABLED=true" >> "$GITHUB_ENV"
            echo "Kredensial Cloudflare lengkap; deployment diaktifkan."
          else
            echo "DEPLOY_ENABLED=false" >> "$GITHUB_ENV"
            echo "Kredensial Cloudflare belum lengkap; deployment backend dilewati dengan aman."
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test backend
        working-directory: backend
        run: npm test
      - name: Siapkan Wrangler
        if: env.DEPLOY_ENABLED == 'true'
        working-directory: backend
        run: |
          cat > wrangler.toml <<EOF
          name = "sehatkita-clinic-api"
          main = "worker.js"
          compatibility_date = "2026-10-01"

          [vars]
          ALLOWED_ORIGIN = "https://akvisomr-eng.github.io"

          [[d1_databases]]
          binding = "DB"
          database_name = "sehatkita-clinic"
          database_id = "${D1_DATABASE_ID}"
          EOF
      - name: Deploy Worker dan migrasi D1
        if: env.DEPLOY_ENABLED == 'true'
        working-directory: backend
        run: |
          npx --yes wrangler@latest d1 execute sehatkita-clinic --remote --file=schema.sql
          printf '%s' "$ADMIN_API_TOKEN" | npx --yes wrangler@latest secret put ADMIN_API_TOKEN
          npx --yes wrangler@latest deploy
