name: Deploy frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Uji mesin triase
        working-directory: react-app
        run: npm test -- --watchAll=false --runInBand healthKnowledge.test.js

      - name: Build SehatKita
        working-directory: react-app
        env:
          PUBLIC_URL: "/AI-HealthCare-Assistant"
          REACT_APP_FACE_API_URL: ""
          REACT_APP_BLOCKCHAIN_NODE: ""
          REACT_APP_GOOGLE_MAPS_API_KEY: ""
          REACT_APP_ALAN_AI_KEY: ""
        run: npm run build

      - name: Uji Admin Center
        working-directory: admin-app
        run: npm install --no-audit --no-fund && npm test -- --watchAll=false --runInBand

      - name: Build Admin Center
        working-directory: admin-app
        env:
          PUBLIC_URL: "/AI-HealthCare-Assistant/admin"
        run: npm install --no-audit --no-fund && npm run build

      - name: Gabungkan aplikasi admin terpisah
        run: |
          rm -rf react-app/build/admin
          mkdir -p react-app/build/admin
          cp -R admin-app/build/. react-app/build/admin/
          test -f react-app/build/admin/index.html
          grep -q "/AI-HealthCare-Assistant/admin/static/" react-app/build/admin/index.html

      - name: Validasi hasil build
        working-directory: react-app
        run: |
          test -f build/index.html
          test -d build/static
          grep -q "/AI-HealthCare-Assistant/static/" build/index.html
          echo "Build GitHub Pages valid: jalur aset memakai prefix repository."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-app/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
